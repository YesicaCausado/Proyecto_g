<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%2d.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2196F3" />
    <meta name="description" content="NeuroLearn AI - Plataforma Inteligente de Aprendizaje Adaptativo para el Saber 11" />
    <link rel="preload" as="image" href="%BASE_URL%2d.png" fetchpriority="high" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <!-- Fuentes UI (+ editoriales de la Landing: Fraunces serif display,
         Space Grotesk técnica y IBM Plex Mono para etiquetas/numeraciones) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
    <title>NeuroLearn AI</title>
    <style>
      .app-loader{position:fixed;z-index:9999;inset:0;display:grid;min-height:100vh;min-height:100dvh;place-items:center;overflow:auto;padding:24px;background:radial-gradient(ellipse at 50% 42%,rgba(11,110,153,.075),transparent 38%),linear-gradient(145deg,#fff 0%,#f7f6f3 100%);color:#37352f;text-align:center}
      .app-loader__content{display:flex;width:min(100%,360px);flex-direction:column;align-items:center}
      .app-loader__mark{position:relative;display:grid;width:92px;height:92px;place-items:center;margin-bottom:20px}
      .app-loader__orbit{position:absolute;inset:0;border:2px solid #e5e7eb;border-top-color:#0b6e99;border-right-color:#5aafd8;border-radius:50%;animation:app-loader-spin 1.15s cubic-bezier(.55,.15,.35,.85) infinite}
      .app-loader__logo{width:62px;height:62px;border-radius:18px;object-fit:cover;box-shadow:0 5px 18px rgba(55,53,47,.12)}
      .app-loader__brand{margin:0;color:#191919;font:700 19px Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.035em}
      .app-loader__brand span{color:#0b6e99}
      .app-loader__message{min-height:20px;margin:8px 0 0;color:#787774;font:13px Inter,"Segoe UI",system-ui,sans-serif}
      .app-loader__progress{position:relative;width:112px;height:3px;overflow:hidden;margin-top:24px;border-radius:99px;background:#e9e9e7}
      .app-loader__progress:after{position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:linear-gradient(90deg,#0b6e99,#5aafd8);content:"";animation:app-loader-progress 1.5s ease-in-out infinite}
      @keyframes app-loader-spin{to{transform:rotate(360deg)}}
      @keyframes app-loader-progress{0%{transform:translateX(-110%)}55%{transform:translateX(150%)}100%{transform:translateX(280%)}}
      @media(prefers-reduced-motion:reduce){.app-loader__orbit,.app-loader__progress:after{animation-duration:3s}}
    </style>
    <script>
      // Rescate (parche 14A): si una versión anterior de la app quedó
      // instalada y respondió una ruta del backend (p. ej. el regreso de
      // Google en /api/v1/integrations/google/callback), se retira esa
      // versión y se vuelve a pedir la URL al servidor.
      (function () {
        var p = window.location.pathname;
        if (!/^\/(api|docs|redoc|health)(\/|$)/.test(p) || !('serviceWorker' in navigator)) return;
        try {
          if (sessionStorage.getItem('sw-rescate') === p) return;
          sessionStorage.setItem('sw-rescate', p);
        } catch (e) { return; }
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .then(function () { window.location.reload(); });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="app-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="app-loader__content">
          <div class="app-loader__mark">
            <span class="app-loader__orbit" aria-hidden="true"></span>
            <img class="app-loader__logo" src="%BASE_URL%2d.png" alt="NeuroLearn IA" fetchpriority="high" />
          </div>
          <p class="app-loader__brand">NeuroLearn <span>IA</span></p>
          <p class="app-loader__message">Preparando tu espacio de aprendizaje</p>
          <span class="app-loader__progress" aria-hidden="true"></span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

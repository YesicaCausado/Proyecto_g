<html lang="es">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%2d.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2196F3" />
    <meta name="description" content="NeuroLearn AI - Plataforma Inteligente de Aprendizaje Adaptativo para el Saber 11" />

    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <!-- Fuentes UI (+ editoriales de la Landing: Fraunces serif display,
         Space Grotesk técnica y IBM Plex Mono para etiquetas/numeraciones) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <title>NeuroLearn AI</title>
    <script>
      // Rescate (parche 14A): si una versión anterior de la app quedó
      // instalada y respondió una ruta del backend (p. ej. el regreso de
      // Google en /api/v1/integrations/google/callback), se retira esa
      // versión y se vuelve a pedir la URL al servidor.
      (function () {
        var p = window.location.pathname;
        if (!/^\/(api|docs|redoc|health)(\/|$)/.test(p) || !('serviceWorker' in navigator)) return;
        try {
          if (sessionStorage.getItem('sw-rescate') === p) return;
          sessionStorage.setItem('sw-rescate', p);
        } catch (e) { return; }
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .then(function () { window.location.reload(); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[pytest]
# Suite automática del backend. Ejecutar desde backend/:  python -m pytest
# El entorno aislado (BD en memoria, correo a consola, sin IA real) lo fija
# tests/entorno_pruebas.py. Guía completa: docs/PRUEBAS.md
testpaths = tests
addopts = -ra
filterwarnings =
    # Avisos de deprecación de dependencias (datetime.utcnow, Pydantic v1
    # Config, etc.); no afectan el resultado y ocultan los fallos reales.
    ignore::DeprecationWarning
